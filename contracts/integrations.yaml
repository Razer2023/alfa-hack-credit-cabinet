openapi: 3.1.0
info:
  title: Данные и интеграции
  description: >
    Моки ЕГРЮЛ, ФНС и выписки по счёту. Профиль компании по ИНН (S3.1)
    проверка полноты заявки (S4.1), моки ЕГРЮЛ, ФНС и БКИ (S4.2),
    запрос и хранение документов (S4.4, S4.7), синтетический массив для дашборда.
    Область B. Ядро вызывает сервис при CORE_INTEGRATIONS_MODE=http.
  version: 0.1.0
paths:
  /health:
    get:
      tags:
        - Служебное
      summary: Сервис жив
      operationId: health
      responses:
        "200":
          description: Процесс отвечает
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /api/v1/companies/{inn}/profile:
    get:
      tags:
        - Компании
      summary: Профиль компании по ИНН
      description: >
        Анкета из ЕГРЮЛ, ФНС и выписки по счёту. У каждого поля есть источник:
        веб показывает его бейджем. Неизвестный ИНН — 404.
      operationId: companyProfile
      parameters:
        - name: inn
          in: path
          required: true
          description: ИНН юридического лица (10 цифр в демо-данных)
          schema:
            type: string
            examples: ["7701234567"]
      responses:
        "200":
          description: Профиль найден
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyProfile"
              example:
                inn: "7701234567"
                fields:
                  name:
                    value: "ООО «Кофейня на Лесной»"
                    source: EGRUL
                  revenue_year:
                    value: 24000000
                    source: BANK_ACCOUNT
        "404":
          description: Компания не найдена
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/checks:
    post:
      tags:
        - Проверки
      summary: Полнота заявки и данные ЕГРЮЛ, ФНС и БКИ
      description: >
        Ядро присылает снимок заявки. Если complete=false, клиенту показывают
        missing[].message. enrichment.bki нужен скорингу: у трёх демо-ИНН
        разные кредитные истории.
      operationId: checkApplication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckRequest"
            example:
              application_id: "11111111-1111-1111-1111-111111111111"
              inn: "7701234567"
              application:
                product_code: EXPRESS
                amount: 2000000
                term_months: 12
                purpose: "Закупка товара"
              company:
                name: "ООО «Кофейня на Лесной»"
                revenue_year: 24000000
              extra: {}
      responses:
        "200":
          description: Результат проверки. Ошибки полноты тоже приходят с кодом 200.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckResult"
              example:
                complete: true
                missing: []
                enrichment:
                  egrul:
                    status: ACTIVE
                    liquidation: false
                  fns:
                    tax_debt: 0
                    mass_address: false
                  bki:
                    max_overdue_days: 0
                    active_loans: 1
                    total_debt: 400000
  /api/v1/dashboard/applications:
    get:
      tags:
        - Дашборд
      summary: Синтетические заявки для дашборда узких мест
      description: >
        Не журнал ядра. Массив заранее посчитанных длительностей этапов,
        чтобы дашборд было на чём показать. Живые данные — область A (S8.1).
      operationId: dashboardApplications
      responses:
        "200":
          description: Список синтетических заявок
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DashboardApplication"
  /api/v1/document-requests:
    post:
      tags:
        - Документы
      summary: Запросить документы у клиента
      operationId: createDocumentRequest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentRequestIn"
      responses:
        "201":
          description: Запрос создан
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentRequest"
        "400":
          description: Некорректный запрос
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    get:
      tags:
        - Документы
      summary: Запросы документов
      operationId: listDocumentRequests
      parameters:
        - name: application_id
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Список запросов
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DocumentRequest"
  /api/v1/document-requests/{request_id}/items/{code}:
    post:
      tags:
        - Документы
      summary: Загрузить файл по пункту запроса
      description: Тело — сам файл. Заголовок X-Filename — имя. Content-Type — application/pdf, image/jpeg или image/png. Не больше 5 МБ.
      operationId: uploadDocument
      parameters:
        - name: request_id
          in: path
          required: true
          schema:
            type: string
        - name: code
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/pdf:
            schema:
              type: string
              format: binary
          image/jpeg:
            schema:
              type: string
              format: binary
          image/png:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: Запрос после загрузки
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentRequest"
        "400":
          description: Файл не принят
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Запрос или пункт не найдены
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          examples: ["ok"]
    CompanyProfile:
      type: object
      required: [inn, fields]
      properties:
        inn:
          type: string
        fields:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/CompanyField"
          description: >
            Поля анкеты. Обязательны для демо name и revenue_year
            (выручка за год нужна скорингу).
    CompanyField:
      type: object
      required: [value, source]
      properties:
        value:
          description: Строка или целое число (сотрудники, выручка, оборот — в рублях, без копеек).
          oneOf:
            - type: string
            - type: integer
        source:
          type: string
          enum: [EGRUL, FNS, BANK_ACCOUNT]
    CheckRequest:
      type: object
      properties:
        application_id:
          type: string
        inn:
          type: string
        application:
          type: object
          additionalProperties: true
        company:
          type: object
          additionalProperties: true
        extra:
          type: object
          additionalProperties: true
    CheckResult:
      type: object
      required: [complete, missing, enrichment]
      properties:
        complete:
          type: boolean
        missing:
          type: array
          items:
            $ref: "#/components/schemas/MissingField"
        enrichment:
          $ref: "#/components/schemas/Enrichment"
    MissingField:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
        message:
          type: string
    Enrichment:
      type: object
      required: [egrul, fns, bki]
      properties:
        egrul:
          $ref: "#/components/schemas/EgrulCheck"
        fns:
          $ref: "#/components/schemas/FnsCheck"
        bki:
          $ref: "#/components/schemas/BkiCheck"
    EgrulCheck:
      type: object
      required: [status, liquidation]
      properties:
        status:
          type: string
          examples: ["ACTIVE"]
        liquidation:
          type: boolean
    FnsCheck:
      type: object
      required: [tax_debt, mass_address]
      description: ФНС, сервис «Прозрачный бизнес»
      properties:
        tax_debt:
          type: integer
          description: Недоимка, рубли
        mass_address:
          type: boolean
    BkiCheck:
      type: object
      required: [max_overdue_days, active_loans, total_debt]
      properties:
        max_overdue_days:
          type: integer
        active_loans:
          type: integer
        total_debt:
          type: integer
          description: Действующие обязательства, рубли
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          examples: ["not_found"]
        message:
          type: string
          examples: ["Компания не найдена"]
    DashboardApplication:
      type: object
      required: [number, inn, company, product_code, amount, result, stage_minutes]
      properties:
        number:
          type: string
        inn:
          type: string
        company:
          type: string
        product_code:
          type: string
        amount:
          type: integer
        result:
          type: string
          enum: [APPROVED, ISSUED, COUNTER_OFFER, REJECTED, MANUAL_REVIEW]
        stage_minutes:
          $ref: "#/components/schemas/StageMinutes"
    StageMinutes:
      type: object
      required: [checking, scoring, manual_review, signing]
      description: Сколько минут заявка провела на этапе. Ноль — этап не было.
      properties:
        checking:
          type: integer
        scoring:
          type: integer
        manual_review:
          type: integer
        signing:
          type: integer
    DocumentRequestIn:
      type: object
      required: [application_id, inn, items]
      properties:
        application_id:
          type: string
        inn:
          type: string
        comment:
          type: string
        items:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/DocumentItemIn"
    DocumentItemIn:
      type: object
      required: [code, title]
      properties:
        code:
          type: string
          description: Латиница в нижнем регистре, до 40 символов
        title:
          type: string
    DocumentRequest:
      type: object
      required: [id, application_id, inn, status, items]
      properties:
        id:
          type: string
        application_id:
          type: string
        inn:
          type: string
        comment:
          type: string
          nullable: true
        status:
          type: string
          enum: [OPEN, COMPLETE]
        items:
          type: array
          items:
            $ref: "#/components/schemas/DocumentItem"
    DocumentItem:
      type: object
      required: [code, title, status]
      properties:
        code:
          type: string
        title:
          type: string
        status:
          type: string
          enum: [WAITING, RECEIVED]
        filename:
          type: string
          nullable: true
        content_type:
          type: string
          nullable: true
        size:
          type: integer
          nullable: true
