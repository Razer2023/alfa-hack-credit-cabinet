server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Живые события (SSE): без буферизации и с долгим таймаутом, иначе события не дойдут до браузера.
    location /api/v1/stream {
        proxy_pass http://core:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    # API ядра
    location /api/ {
        proxy_pass http://core:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Собранные файлы с хешем в имени можно кешировать надолго
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Одностраничное приложение: все остальные пути отдают index.html
    location / {
        try_files $uri /index.html;
    }
}
